<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sân - SportHub</title>
    <link rel="stylesheet" href="/frontend/css/home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Bố cục chính theo dạng lưới 2 cột */
        .detail-layout { display: grid; grid-template-columns: 1.8fr 1fr; gap: 40px; margin-top: 30px; margin-bottom: 50px; }

        /* Cột trái: Thông tin sân */
        .main-gallery img { width: 100%; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); object-fit: cover; max-height: 450px; }
        .main-gallery .image-placeholder { min-height: 320px; border-radius: 20px; background: linear-gradient(135deg, #e8f5e9, #f8f9fa); display: flex; align-items: center; justify-content: center; color: #28a745; font-weight: bold; font-size: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .court-header-info { margin-top: 25px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .badge-type { background: #e8f5e9; color: #28a745; padding: 6px 16px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        .address-text { color: #666; font-size: 1.1rem; margin-top: 10px; }
        .content-section { margin-top: 35px; }
        .description-text { line-height: 1.8; color: #444; background: #f9f9f9; padding: 25px; border-radius: 12px; border-left: 5px solid #28a745; }
        .map-box { margin-top: 15px; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        /* Cột phải: Đặt lịch (Sticky) */
        .booking-sticky { position: sticky; top: 100px; height: fit-content; }
        .booking-card { background: #fff; padding: 30px; border-radius: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); border: 1px solid #f0f0f0; }
        .date-picker-custom { margin: 15px 0 25px; padding: 12px; width: 100%; border-radius: 10px; border: 1px solid #ddd; font-family: inherit; font-size: 1rem; }
        
        /* Ma trận giờ */
        .slot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .slot-item { padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; border: 2px solid #f0f0f0; transition: 0.3s; background: #fff; }
        .slot-item strong { display: block; font-size: 1.1rem; }
        .Available { background: #f0fff4; border-color: #2ecc71; color: #27ae60; }
        .Full { background: #fff5f5; border-color: #feb2b2; color: #c53030; opacity: 0.6; cursor: not-allowed; }
        .selected { background: #2ecc71 !important; color: white !important; transform: scale(1.03); box-shadow: 0 5px 15px rgba(46, 204, 113, 0.3); }

        .price-box { margin-top: 25px; padding: 20px; background: #fff9f0; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .price-box strong { font-size: 1.4rem; color: #e67e22; }

        .btn-confirm-final { 
            background: linear-gradient(135deg, #28a745, #218838); color: white; 
            border: none; padding: 20px; width: 100%; border-radius: 15px; 
            font-size: 1.1rem; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 20px;
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.2);
        }
        .btn-confirm-final:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(40, 167, 69, 0.3); }
        
        @media (max-width: 768px) { .detail-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo" onclick="location.href='/frontend/home.html'" style="cursor:pointer">SPORT<span>HUB</span></div>
    </nav>

    <main class="container">
        <div class="detail-layout">
            <div class="court-main-info">
                <div class="main-gallery">
                    <div id="courtImgFallback" class="image-placeholder">SportHub</div>
                    <img id="courtImg" src="" alt="Sân bóng" style="display:none">
                </div>

                <div class="court-header-info">
                    <div class="flex-between">
                        <h1 id="courtName">Đang tải tên sân...</h1>
                        <span id="courtType" class="badge-type">...</span>
                    </div>
                    <p id="courtAddr" class="address-text"><i class="fa-solid fa-location-dot"></i> Đang tải địa chỉ...</p>
                </div>

                <div class="content-section">
                    <h3><i class="fa-solid fa-circle-info"></i> Mô tả chi tiết</h3>
                    <p id="courtDesc" class="description-text">Đang tải mô tả từ hệ thống...</p>
                </div>

                <div class="content-section">
                    <h3><i class="fa-solid fa-map-location-dot"></i> Vị trí trên bản đồ</h3>
                    <div id="mapContainer" class="map-box">
                        <iframe id="googleMap" width="100%" height="350" frameborder="0" style="border:0"></iframe>
                    </div>
                </div>
            </div>

            <aside class="booking-sticky">
                <div class="booking-card">
                    <h3>Đặt lịch ngay</h3>
                    <div class="booking-form">
                        <label>Chọn ngày đá:</label>
                        <input type="date" id="bookingDate" class="date-picker-custom">

                        <div id="slotContainer" class="slot-grid">
                            </div>

                        <div id="priceInfo" class="price-box" style="display:none">
                            <span>Tổng thanh toán:</span>
                            <strong id="totalPrice">0đ</strong>
                        </div>

                        <button id="btnConfirm" class="btn-confirm-final" style="display:none" onclick="submitBooking()">
                            XÁC NHẬN ĐẶT SÂN <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script src="/frontend/js/detail.js"></script>
</body>
</html>
